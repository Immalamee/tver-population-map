                    popup._contentNode.classList.add('media');

                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }

            layer.bindTooltip((layer.feature.properties['name'] !== null?String('<div style="color: #323232; font-size: 9pt; font-family: \'Open Sans\', sans-serif;">' + layer.feature.properties['name']).replace(/\\n/g, '<br>') + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_admin_level_6__2'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });
        resetLabels([layer_admin_level_6__2]);
        map.on("zoomend", function(){
            resetLabels([layer_admin_level_6__2]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_admin_level_6__2]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_admin_level_6__2]);
        });
        </script>
